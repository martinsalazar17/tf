<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cooperative Portal</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f4f6f8;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    #fallback a {
      margin-top: 12px;
      color: #2b6cb0;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycby_B7b6ONsrrmslGhbqwFzwLhGEVDKe0PifRA85MSm9VIjhMCxKxsbU33xUpJgpHd3MEQ/exec"
    title="Cooperative Portal"
    allow="clipboard-write">
  </iframe>

  <div id="fallback">
    <p>If the portal doesn't load below, open it directly:</p>
    <a href="https://script.google.com/macros/s/AKfycby_B7b6ONsrrmslGhbqwFzwLhGEVDKe0PifRA85MSm9VIjhMCxKxsbU33xUpJgpHd3MEQ/exec" target="_blank" rel="noopener">
      Open Cooperative Portal
    </a>
  </div>

  <script>
    // If the iframe fails to load (network issue, blocked, etc.), show a direct link instead.
    document.getElementById('appFrame').addEventListener('error', function () {
      document.getElementById('appFrame').style.display = 'none';
      document.getElementById('fallback').style.display = 'flex';
    });
  </script>
</body>
</html>
