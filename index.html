<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Finance Sinking Fund</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /*
      DESIGN TOKENS — "iOS 18 Glass"
      Frosted-glass cards floating over a soft gradient canvas, San
      Francisco-style type scale, pill-shaped controls, and Apple's
      semantic system colors. Every class name below is still what the
      JS in this file generates — only the visual treatment changed.
    */
    :root {
      --ios-blue: #007AFF;
      --ios-blue-dark: #0062CC;
      --ios-green: #34C759;
      --ios-red: #FF3B30;
      --ios-orange: #FF9500;
      --ios-purple: #AF52DE;
      --bg-base: #F2F2F7;
      --card-bg: rgba(255,255,255,0.68);
      --card-border: rgba(255,255,255,0.55);
      --fill-secondary: rgba(118,118,128,0.12);
      --text-primary: #1C1C1E;
      --text-secondary: rgba(60,60,67,0.6);
      --text-tertiary: rgba(60,60,67,0.4);
      --hairline: rgba(60,60,67,0.13);
      --font-system: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      --brandbar-h: 56px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body {
      font-family: var(--font-system);
      margin: 0;
      min-height: 100%;
      color: var(--text-primary);
      background-color: var(--bg-base);
      /* Soft mesh-gradient canvas — the "wallpaper" the glass cards float over */
      background-image:
        radial-gradient(circle at 12% 8%, rgba(0,122,255,0.16), transparent 42%),
        radial-gradient(circle at 88% 18%, rgba(175,82,222,0.14), transparent 40%),
        radial-gradient(circle at 20% 92%, rgba(52,199,89,0.14), transparent 42%),
        radial-gradient(circle at 90% 88%, rgba(255,149,0,0.10), transparent 40%);
      background-attachment: fixed;
    }

    /* ---- Persistent brand strip: floating glass navbar, present on every screen ---- */
    .brandbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(242,242,247,0.75);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--hairline);
      padding: 13px 16px;
    }
    .brandbar-inner {
      max-width: 480px; margin: 0 auto;
      display: flex; align-items: center; gap: 8px;
    }
    .brandmark {
      font-size: 17px; font-weight: 700; letter-spacing: -0.2px; color: var(--text-primary);
    }
    .brandtag {
      font-size: 13px; color: var(--text-secondary); font-weight: 500;
    }

    .center-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--brandbar-h));
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      padding: 30px 26px;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 380px;
    }
    h1 {
      font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.4px; color: var(--text-primary);
    }
    h2 {
      font-size: 20px; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.2px; color: var(--text-primary);
      display: flex; align-items: center; gap: 8px;
    }
    p.sub { font-size: 15px; color: var(--text-secondary); margin: 0 0 20px; line-height: 1.4; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-secondary); font-weight: 500; }
    input, select {
      width: 100%; min-height: 44px; padding: 10px 14px; margin-bottom: 16px;
      border: none; border-radius: 14px;
      background: var(--fill-secondary); font-size: 16px; font-family: var(--font-system); color: var(--text-primary);
      transition: box-shadow 0.15s ease;
    }
    input:focus, select:focus {
      outline: none; box-shadow: 0 0 0 2px var(--ios-blue);
    }
    input[type="number"], input[type="date"] { font-variant-numeric: tabular-nums; }
    button {
      width: 100%; min-height: 44px; padding: 11px; background: var(--ios-blue); color: #fff;
      border: none; border-radius: 9999px;
      font-family: var(--font-system); font-size: 17px; font-weight: 600; cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.2s ease;
    }
    button:hover { background: var(--ios-blue-dark); box-shadow: 0 6px 18px rgba(0,122,255,0.35); transform: translateY(-1px); }
    button:active { transform: scale(0.97) translateY(0); }
    button.secondary {
      background: var(--fill-secondary); color: var(--ios-blue); margin-top: 8px;
    }
    button.secondary:hover { background: rgba(118,118,128,0.2); }
    button:disabled { background: var(--fill-secondary); color: var(--text-tertiary); cursor: not-allowed; transform: none; }
    #error, .err { color: var(--ios-red); font-size: 13px; margin-top: 10px; min-height: 16px; }
    .app-shell { max-width: 480px; margin: 0 auto; padding: 18px 16px 40px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px;
    }
    .topbar span { font-size: 15px; color: var(--text-secondary); font-weight: 500; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px; padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .stat-card .label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .stat-card .value { font-size: 22px; font-weight: 700; margin-top: 6px; color: var(--text-primary); font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
    .section {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 22px; padding: 18px; margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .loan-row, .div-row {
      display: flex; justify-content: space-between; padding: 10px 0;
      border-bottom: 1px solid var(--hairline); font-size: 15px;
    }
    .loan-row:last-child, .div-row:last-child { border-bottom: none; }
    .badge {
      display: inline-block;
      font-size: 12px; padding: 4px 12px; border-radius: 9999px; font-weight: 600;
    }
    .badge.Pending { color: #fff; background: var(--ios-orange); }
    .badge.Approved, .badge.Active, .badge.Verified { color: #fff; background: var(--ios-green); }
    .badge.Rejected { color: #fff; background: var(--ios-red); }
    .badge.Paid { color: #fff; background: var(--ios-blue); }
    .calc-box {
      background: var(--fill-secondary);
      border-radius: 16px; padding: 14px; margin: 12px 0; font-size: 14px;
    }
    .calc-box .row { display: flex; justify-content: space-between; padding: 4px 0; font-variant-numeric: tabular-nums; }
    .calc-box .row.total { font-weight: 700; border-top: 1px solid var(--hairline); margin-top: 6px; padding-top: 8px; color: var(--ios-blue); }
    .hint { font-size: 12.5px; color: var(--text-secondary); margin-top: -10px; margin-bottom: 14px; }
    .link-btn {
      background: none; border: none; color: var(--ios-blue); font-size: 15px;
      cursor: pointer; width: auto; padding: 5px 10px; min-height: 0;
      font-weight: 500; font-family: var(--font-system);
      border-radius: 8px; transition: background 0.15s ease, color 0.15s ease;
    }
    .link-btn:hover { background: var(--ios-blue-dark); color: #fff; }
    .link-btn:active { background: var(--ios-blue); color: #fff; }
    .password-field { position: relative; margin-bottom: 16px; }
    .password-field input { margin-bottom: 0; padding-right: 42px; }
    .password-toggle {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      background: none; border: none; width: 32px; height: 32px; min-height: 0;
      padding: 0; display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); cursor: pointer;
    }
    .icon-btn {
      width: 30px; height: 30px; min-height: 0; padding: 0;
      border-radius: 8px; border: none; background: var(--fill-secondary);
      color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s ease, color 0.15s ease; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--ios-blue-dark); color: #fff; }
    .icon-btn.danger:hover { background: var(--ios-red); color: #fff; }
    .icon-btn.warn:hover { background: var(--ios-orange); color: #fff; }
    .empty { font-size: 14px; color: var(--text-tertiary); text-align: center; padding: 16px 0; }
    html { scroll-behavior: smooth; }
    #app { transition: opacity 0.22s ease; opacity: 1; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card, .section, .approval-card { animation: fadeInUp 0.45s cubic-bezier(.16,.8,.28,1) both; }
    .stat-card { animation: fadeInUp 0.4s ease-out both; }
    .stat-grid .stat-card:nth-child(1) { animation-delay: 0s; }
    .stat-grid .stat-card:nth-child(2) { animation-delay: 0.08s; }

    /* ---- iOS-style spinner (12 fading blades) ---- */
    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 26px 0; }
    .spinner { position: relative; width: 32px; height: 32px; }
    .spinner .spinner-blade {
      position: absolute; left: 46.5%; top: 37%;
      width: 7%; height: 27%; border-radius: 30%;
      background-color: var(--ios-blue);
      transform-origin: center -0.2em;
      animation: spinner-fade 1s infinite linear;
    }
    .spinner .spinner-blade:nth-child(1) { animation-delay: -1.1458333333s; transform: rotate(0deg); }
    .spinner .spinner-blade:nth-child(2) { animation-delay: -1.0416666667s; transform: rotate(30deg); }
    .spinner .spinner-blade:nth-child(3) { animation-delay: -0.9375s; transform: rotate(60deg); }
    .spinner .spinner-blade:nth-child(4) { animation-delay: -0.8333333333s; transform: rotate(90deg); }
    .spinner .spinner-blade:nth-child(5) { animation-delay: -0.7291666667s; transform: rotate(120deg); }
    .spinner .spinner-blade:nth-child(6) { animation-delay: -0.625s; transform: rotate(150deg); }
    .spinner .spinner-blade:nth-child(7) { animation-delay: -0.5208333333s; transform: rotate(180deg); }
    .spinner .spinner-blade:nth-child(8) { animation-delay: -0.4166666667s; transform: rotate(210deg); }
    .spinner .spinner-blade:nth-child(9) { animation-delay: -0.3125s; transform: rotate(240deg); }
    .spinner .spinner-blade:nth-child(10) { animation-delay: -0.2083333333s; transform: rotate(270deg); }
    .spinner .spinner-blade:nth-child(11) { animation-delay: -0.1041666667s; transform: rotate(300deg); }
    .spinner .spinner-blade:nth-child(12) { animation-delay: 0s; transform: rotate(330deg); }
    @keyframes spinner-fade { 0% { opacity: 0.85; } 50% { opacity: 0.25; } 100% { opacity: 0.25; } }

    .nav-list {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 22px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .nav-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; cursor: pointer;
      border-bottom: 1px solid var(--hairline);
      transition: background 0.15s ease, box-shadow 0.15s ease;
      animation: fadeInUp 0.4s ease-out both;
    }
    .nav-row:last-child { border-bottom: none; }
    .nav-row:hover { background: rgba(118,118,128,0.1); box-shadow: inset 0 0 0 1px rgba(0,122,255,0.15); }
    .nav-row:active { background: rgba(118,118,128,0.16); }
    .nav-row:nth-child(1) { animation-delay: 0s; }
    .nav-row:nth-child(2) { animation-delay: 0.06s; }
    .nav-row:nth-child(3) { animation-delay: 0.12s; }
    .nav-row:nth-child(4) { animation-delay: 0.18s; }
    .nav-row:nth-child(5) { animation-delay: 0.24s; }
    .nav-row:nth-child(6) { animation-delay: 0.3s; }
    .nav-row .nav-icon { margin-bottom: 0; flex-shrink: 0; }
    .nav-row-text { flex: 1; min-width: 0; }
    .nav-row-chevron { color: var(--text-tertiary); flex-shrink: 0; display: flex; }
    .nav-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px;
    }
    .nav-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; letter-spacing: -0.1px; }
    .nav-sub { font-size: 12.5px; color: var(--text-secondary); }
    .approval-card { margin-bottom: 14px; }
    .approval-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .member-context {
      font-size: 12.5px; color: var(--text-secondary); background: var(--fill-secondary);
      border-radius: 12px; padding: 9px 12px; margin: 10px 0;
    }
    .approval-actions { display: flex; gap: 10px; margin-top: 12px; }
    .approval-actions button { margin: 0; }
    /* iOS-style segmented control */
    .tabs {
      display: flex; gap: 2px; margin-bottom: 16px;
      background: var(--fill-secondary); border-radius: 12px; padding: 2px;
    }
    .tab {
      flex: 1; padding: 8px; background: transparent; color: var(--text-secondary);
      border: none; border-radius: 10px;
      font-family: var(--font-system); font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .tab.active { background: #fff; color: var(--text-primary); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .bulk-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px;
      padding: 12px; background: var(--fill-secondary); border-radius: 16px;
    }
    .bulk-row select, .bulk-row input { margin-bottom: 0; grid-column: span 1; }
    .bulk-row button { grid-column: span 2; width: auto; justify-self: start; min-height: 36px; padding: 8px 18px; font-size: 14px; }
    @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.94) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
      animation: modalFadeIn 0.15s ease-out both;
    }
    .modal-card {
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border: 1px solid var(--card-border); border-radius: 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      padding: 26px 24px; width: 100%; max-width: 340px;
      text-align: center;
      animation: modalPop 0.18s cubic-bezier(.2,.8,.3,1.2) both;
    }
    .modal-card h2 { justify-content: center; border-bottom: none; padding-bottom: 0; margin-bottom: 8px; }
    .modal-card p { font-size: 14px; color: var(--text-secondary); margin: 0 0 22px; line-height: 1.4; }
    .modal-card button { margin-bottom: 10px; }
    .modal-card button:last-child { margin-bottom: 0; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="brandbar">
    <div class="brandbar-inner">
      <span class="brandmark">Finance Sinking Fund</span>
      <span class="brandtag">&middot; portal</span>
    </div>
  </header>
  <div id="app"></div>
  <div id="modalRoot"></div>


  <script>
    // ---------- Server connection ----------
    // This page is served from tf.alvinsalazar.com, NOT from Apps Script,
    // so google.script.run doesn't exist here — it's a browser API that
    // Apps Script's HtmlService injects automatically, and only works for
    // pages Apps Script itself serves. This shim reproduces the exact
    // same chainable interface (.withSuccessHandler().withFailureHandler()
    // .functionName(args)) but sends a real fetch() to the Apps Script
    // JSON API underneath. Every other line of app code below is
    // unchanged from the Apps Script version.
    const API_URL = 'https://script.google.com/macros/s/AKfycby_B7b6ONsrrmslGhbqwFzwLhGEVDKe0PifRA85MSm9VIjhMCxKxsbU33xUpJgpHd3MEQ/exec';

    function buildRunner(successHandler, failureHandler) {
      return new Proxy({}, {
        get: function (target, prop) {
          if (prop === 'withSuccessHandler') {
            return function (fn) { return buildRunner(fn, failureHandler); };
          }
          if (prop === 'withFailureHandler') {
            return function (fn) { return buildRunner(successHandler, fn); };
          }
          // Any other property access is the server function name to call.
          return function () {
            const args = Array.prototype.slice.call(arguments);
            // Content-Type text/plain keeps this a "simple request" so the
            // browser skips the CORS preflight (OPTIONS) that Apps Script
            // web apps can't respond to properly.
            fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: prop, params: args })
            })
              .then(function (res) { return res.json(); })
              .then(function (data) {
                if (successHandler) successHandler(data);
              })
              .catch(function (err) {
                if (failureHandler) failureHandler(err);
              });
          };
        }
      });
    }

    const google = { script: { run: buildRunner(null, null) } };

    // ---------- App state ----------
    let TOKEN = sessionStorage.getItem('coop_token') || null;
    let ROLE = sessionStorage.getItem('coop_role') || null;
    let NAME = sessionStorage.getItem('coop_name') || null;

    window.addEventListener('DOMContentLoaded', function () {
      if (TOKEN) {
        google.script.run
          .withSuccessHandler(function (res) {
            if (res.success) { route(); } else { clearSession(); renderLogin(); }
          })
          .withFailureHandler(function () { clearSession(); renderLogin(); })
          .validateSession(TOKEN);
      } else {
        renderLogin();
      }
    });

    function route() {
      if (ROLE === 'Admin') {
        renderAdminHome();
      } else {
        renderMemberDashboard();
      }
    }

    function clearSession() {
      sessionStorage.removeItem('coop_token');
      sessionStorage.removeItem('coop_role');
      sessionStorage.removeItem('coop_name');
      TOKEN = null; ROLE = null; NAME = null;
    }

    function logoutAndReload() {
      if (TOKEN) google.script.run.logout(TOKEN);
      clearSession();
      renderLogin();
    }

    function fmtMoney(n) {
      n = Number(n) || 0;
      return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString();
    }

    // Live "#,000.00" formatting for Amount fields as the user types.
    // These fields are type="text" (not type="number") since browsers
    // reject commas in a number input — the numeric-only keyboard on
    // mobile still shows via inputmode="decimal".
    function formatAmountOnInput(e) {
      const el = e.target;
      let raw = el.value.replace(/[^0-9.]/g, '');
      const firstDot = raw.indexOf('.');
      if (firstDot !== -1) {
        raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, '');
      }
      const parts = raw.split('.');
      const intPart = parts[0] ? parts[0].replace(/^0+(?=\d)/, '') : '';
      const decPart = parts.length > 1 ? parts[1].slice(0, 2) : undefined;
      const formattedInt = intPart ? Number(intPart).toLocaleString('en-US') : '';
      el.value = decPart !== undefined ? formattedInt + '.' + decPart : formattedInt;
    }

    // Reads an amount field's value with the display commas stripped,
    // ready to send to the server or use in a calculation.
    function parseAmountValue(id) {
      const el = document.getElementById(id);
      if (!el) return '';
      return (el.value || '').replace(/,/g, '');
    }

    // ---------- In-app modal (replaces native confirm()/alert()) ----------
    function showConfirmModal(opts) {
      const root = document.getElementById('modalRoot');
      const confirmStyle = opts.danger ? 'background:var(--ios-red);border-color:var(--ios-red);' : '';
      root.innerHTML =
        '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal-card">' +
        '<h2>' + (opts.title || 'Are you sure?') + '</h2>' +
        '<p>' + opts.message + '</p>' +
        '<button id="modalConfirmBtn" style="' + confirmStyle + '">' + (opts.confirmLabel || 'Confirm') + '</button>' +
        '<button class="secondary" id="modalCancelBtn">' + (opts.cancelLabel || 'Cancel') + '</button>' +
        '</div></div>';

      document.getElementById('modalCancelBtn').onclick = closeModal;
      document.getElementById('modalOverlay').addEventListener('click', function (e) {
        if (e.target.id === 'modalOverlay') closeModal();
      });
      document.getElementById('modalConfirmBtn').onclick = function () {
        closeModal();
        if (opts.onConfirm) opts.onConfirm();
      };
    }

    function showInfoModal(message, title) {
      const root = document.getElementById('modalRoot');
      root.innerHTML =
        '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal-card">' +
        '<h2>' + (title || 'Notice') + '</h2>' +
        '<p>' + message + '</p>' +
        '<button id="modalOkBtn">OK</button>' +
        '</div></div>';
      document.getElementById('modalOkBtn').onclick = closeModal;
      document.getElementById('modalOverlay').addEventListener('click', function (e) {
        if (e.target.id === 'modalOverlay') closeModal();
      });
    }

    function closeModal() {
      document.getElementById('modalRoot').innerHTML = '';
    }

    // ---------- iOS-style colored icon chips (monoline, 1.8px stroke) ----------
    const ICONS = {

    function iconChip(iconKey, colorHex) {
      // colorHex + '1A' appends ~10% alpha as an 8-digit hex color for the chip background
      return '<div class="nav-icon" style="background:' + colorHex + '1A;color:' + colorHex + '">' + ICONS[iconKey] + '</div>';
    }

    // iOS-style 12-blade activity indicator, used everywhere a screen shows "Loading..."
    function spinnerHTML() {
      let blades = '';
      for (let i = 0; i < 12; i++) blades += '<div class="spinner-blade"></div>';
      return '<div class="spinner-wrap"><div class="spinner">' + blades + '</div></div>';
    }

    // Fades #app out, swaps its content, then fades back in — used for every
    // full-screen navigation change (Section Transitions / page swaps).
    // afterInsert runs right after the new HTML lands, for any DOM wiring
    // (event listeners) that needs the new elements to already exist.
    function swapApp(html, afterInsert) {
      const app = document.getElementById('app');
      app.style.opacity = '0';
      setTimeout(function () {
        app.innerHTML = html;
        if (afterInsert) afterInsert();
        void app.offsetWidth; // force reflow so the fade-in actually animates
        app.style.opacity = '1';
      }, 180);
    }

    // ---------- LOGIN ----------
    function renderLogin() {
      swapApp(
        '<div class="center-screen"><div class="card">' +
        '<h1>Finance Sinking Fund</h1>' +
        '<p class="sub">Sign in with the credentials given to you.</p>' +
        '<form id="loginForm">' +
        '<label for="username">Username</label>' +
        '<input type="text" id="username" required autocomplete="username">' +
        '<label for="password">Password</label>' +
        '<div class="password-field">' +
        '<input type="password" id="password" required autocomplete="current-password">' +
        '<button type="button" class="password-toggle" id="passwordToggle" onclick="togglePasswordVisibility()" aria-label="Show password">' + ICONS.eye + '</button>' +
        '</div>' +
        '<button type="submit" id="submitBtn">Log In</button>' +
        '<div id="error"></div>' +
        '</form></div></div>',
        function () {
          document.getElementById('loginForm').addEventListener('submit', handleLogin);
        }
      );
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const btn = document.getElementById('passwordToggle');
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = ICONS.eyeOff;
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        btn.innerHTML = ICONS.eye;
        btn.setAttribute('aria-label', 'Show password');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = 'Log In';
          if (res.success) {
            TOKEN = res.token; ROLE = res.role; NAME = res.fullName;
            sessionStorage.setItem('coop_token', TOKEN);
            sessionStorage.setItem('coop_role', ROLE);
            sessionStorage.setItem('coop_name', NAME);
            route();
          } else {
            errorEl.textContent = res.message || 'Login failed.';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Log In';
          errorEl.textContent = 'Something went wrong. Please try again.';
        })
        .login(username, password);
    }

    function renderDashboardContent(data) {
      let loansHtml = '<div class="empty">No loans on record.</div>';
      if (data.loans.length) {
        loansHtml = data.loans.map(function (l) {
          let repayHtml = '<div class="empty">No payments recorded yet.</div>';
          if (l.repayments.length) {
            repayHtml = l.repayments.map(function (r) {
              return '<div class="loan-row"><span>' + fmtDate(r.paymentDate) + ' &middot; ' + fmtMoney(r.amountPaid) + '</span>' +
                '<span class="hint" style="margin:0">P ' + fmtMoney(r.principalPaid) + ' / I ' + fmtMoney(r.interestPaid) + '</span></div>';
            }).join('');
          }
          return '<div class="loan-row" style="cursor:pointer" onclick="toggleLoanDetail(\'' + l.loanId + '\')">' +
            '<span>' + fmtMoney(l.principal) + ' &middot; ' + l.tenureMonths + 'mo</span>' +
            '<span class="badge ' + l.status + '">' + l.status + '</span>' +
            '</div>' +
            '<div id="loanDetail-' + l.loanId + '" style="display:none">' +
            '<div class="calc-box">' +
            '<div class="row"><span>Principal</span><span>' + fmtMoney(l.principal) + '</span></div>' +
            '<div class="row"><span>Interest Rate</span><span>' + l.interestRate + '% / month</span></div>' +
            '<div class="row"><span>Period</span><span>' + l.tenureMonths + ' months</span></div>' +
            '<div class="row"><span>Monthly Amortization</span><span>' + fmtMoney(l.monthlyAmortization) + '</span></div>' +
            '<div class="row total"><span>Remaining Balance</span><span>' + fmtMoney(l.remainingBalance) + '</span></div>' +
            '</div>' +
            (l.purpose ? '<div class="hint">Purpose: ' + l.purpose + '</div>' : '') +
            '<div class="hint" style="margin-bottom:8px">Payment Trail</div>' + repayHtml +
            '</div>';
        }).join('');

      let divHtml = '<div class="empty">No dividends recorded yet.</div>';
      if (data.dividendHistory.length) {
        divHtml = data.dividendHistory.map(function (d) {
          return '<div class="div-row"><span>' + d.year + '</span><span>' + fmtMoney(d.amount) + '</span></div>';
        }).join('');

      document.getElementById('dashContent').innerHTML =
        '<div class="stat-grid">' +
        '<div class="stat-card">' + iconChip('wallet', '#AF52DE') + '<div class="label">Total Contributions</div><div class="value">' + fmtMoney(data.totalContributions) + '</div></div>' +

        '</div>' +
        '<div class="section"><h2>My Loans</h2>' + loansHtml + '</div>' +
        '<div class="section"><h2>Contributions</h2>' +
        '<button onclick="renderContributionLedger()">View Contributions</button></div>' +
        '<div class="section"><h2>Dividend History</h2>' + divHtml + '</div>';
    }

    function renderLoanApplicationContent(members, settings) {
      const minRate = Number(settings.InterestRate_Min.value);
      const maxRate = Number(settings.InterestRate_Max.value);
      const defaultRate = Number(settings.InterestRate_Default.value);
      const options = members.map(function (m) {
        return '<option value="' + m.memberId + '">' + m.fullName + '</option>';
      }).join('');

      document.getElementById('loanAppContent').innerHTML =
        '<div class="section">' +
        '<form id="loanAppForm">' +
        '<label>Member</label>' +
        '<select id="loanMember" required>' + options + '</select>' +
        '<label>Loan Amount</label>' +
        '<input type="text" inputmode="decimal" id="loanPrincipal" oninput="formatAmountOnInput(event)" required>' +
        '<label>Interest Rate (% per month)</label>' +
        '<input type="number" id="loanRate" min="' + minRate + '" max="' + maxRate + '" step="0.1" value="' + defaultRate + '" required>' +
        '<div class="hint">Allowed range: ' + minRate + '% - ' + maxRate + '%</div>' +
        '<label>Tenure (months)</label>' +
        '<input type="number" id="loanTenure" min="1" step="1" value="6" required>' +
        '<label>Purpose (optional)</label>' +
        '<input type="text" id="loanPurpose">' +
        '<div id="loanAppCalcBox" class="calc-box"></div>' +
        '<button type="submit" id="loanAppSubmitBtn">Create Loan</button>' +
        '<div id="loanAppMsg" class="err"></div>' +
        '</form></div>';

      const principalEl = document.getElementById('loanPrincipal');
      const rateEl = document.getElementById('loanRate');
      const tenureEl = document.getElementById('loanTenure');
      [principalEl, rateEl, tenureEl].forEach(function (el) {
        el.addEventListener('input', updateLoanAppCalcPreview);
      });
      updateLoanAppCalcPreview();

      document.getElementById('loanAppForm').addEventListener('submit', submitAdminLoan);
    }

    // Mirrors the server's flat-rate formula exactly for instant feedback:
    // TotalInterest = Principal * (Rate/100) * TenureMonths
    // MonthlyAmortization = (Principal + TotalInterest) / TenureMonths
    function updateLoanAppCalcPreview() {
      const principal = Number(parseAmountValue('loanPrincipal')) || 0;
      const rate = Number(document.getElementById('loanRate').value) || 0;
      const tenure = Number(document.getElementById('loanTenure').value) || 0;
      const box = document.getElementById('loanAppCalcBox');

      if (!principal || !tenure) {
        box.innerHTML = '<div class="empty">Enter amount and tenure to see estimated payments.</div>';
        return;
      }
      const totalInterest = principal * (rate / 100) * tenure;
      const totalPayable = principal + totalInterest;
      const monthly = totalPayable / tenure;

      box.innerHTML =
        '<div class="row"><span>Total Interest</span><span>' + fmtMoney(totalInterest) + '</span></div>' +
        '<div class="row"><span>Total Payable</span><span>' + fmtMoney(totalPayable) + '</span></div>' +
        '<div class="row total"><span>Monthly Amortization</span><span>' + fmtMoney(monthly) + '</span></div>';
    }

    function submitAdminLoan(e) {
      e.preventDefault();
      const memberId = document.getElementById('loanMember').value;
      const principal = parseAmountValue('loanPrincipal');
      const rate = document.getElementById('loanRate').value;
      const tenure = document.getElementById('loanTenure').value;
      const purpose = document.getElementById('loanPurpose').value;
      const btn = document.getElementById('loanAppSubmitBtn');
      const msgEl = document.getElementById('loanAppMsg');
      msgEl.textContent = '';
      msgEl.style.color = '#FF3B30';
      btn.disabled = true;
      btn.textContent = 'Creating...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = 'Create Loan';
          if (res.success) {
            document.getElementById('loanAppForm').reset();
            msgEl.style.color = '#34C759';
            msgEl.textContent = 'Loan created — monthly amortization ' + fmtMoney(res.monthlyAmortization) + '.';
            updateLoanAppCalcPreview();
          } else {
            msgEl.textContent = res.message || 'Could not create loan.';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Create Loan';
          msgEl.textContent = 'Something went wrong. Please try again.';
        })
        .createLoanForMember(TOKEN, memberId, principal, rate, tenure, purpose);
    }

    function startEditMember(memberId) {
      const m = MEMBERS_CACHE.find(function (x) { return String(x.memberId) === String(memberId); });
      if (!m) { showInfoModal('Could not find that member — try refreshing the list.', 'Error'); return; }
      EDITING_MEMBER_ID = memberId;
      document.getElementById('memberName').value = m.fullName;
      document.getElementById('memberIdInput').value = m.memberId;
      document.getElementById('memberIdInput').disabled = true;
      document.getElementById('memberUsername').value = m.username;
      document.getElementById('memberEmail').value = m.email;
      document.getElementById('memberPassword').value = '';
      document.getElementById('memberPassword').required = false;
      document.getElementById('memberPassword').placeholder = 'Leave blank to keep current password';
      document.getElementById('memberSubmitBtn').textContent = 'Save Changes';
      document.getElementById('memberCancelBtn').style.display = 'block';
      document.getElementById('memberFormMsg').textContent = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditMember() {
      EDITING_MEMBER_ID = null;
      document.getElementById('memberForm').reset();
      document.getElementById('memberIdInput').disabled = false;
      document.getElementById('memberPassword').required = true;
      document.getElementById('memberPassword').placeholder = 'min. 6 characters';
      document.getElementById('memberSubmitBtn').textContent = 'Add Member';
      document.getElementById('memberCancelBtn').style.display = 'none';
      document.getElementById('memberFormMsg').textContent = '';
    }

    function confirmDeactivateMember(memberId) {
      const m = MEMBERS_CACHE.find(function (x) { return String(x.memberId) === String(memberId); });
      const name = m ? m.fullName : 'this member';

      showConfirmModal({
        title: 'Deactivate Member',
        message: 'Deactivate ' + name + '? They will no longer be able to log in, but their record stays in the system — their contribution and loan history is fully preserved, and their name will keep showing correctly everywhere. Note: their Member ID, Username, and Email stay reserved and can\'t be reused for a new member while deactivated.',
        confirmLabel: 'Deactivate',
        danger: true,
        onConfirm: function () {
          google.script.run
            .withSuccessHandler(function (res) {
              if (res.success) {
                if (EDITING_MEMBER_ID === memberId) cancelEditMember();
                loadMemberList();
              } else {
                showInfoModal(res.message || 'Could not deactivate member.', 'Error');
              }
            })
            .withFailureHandler(function () {
              showInfoModal('Something went wrong. Please try again.', 'Error');
            })
            .deactivateMember(TOKEN, memberId);
        }
      });
    }

    function confirmPermanentDeleteMember(memberId) {
      const m = MEMBERS_CACHE.find(function (x) { return String(x.memberId) === String(memberId); });
      const name = m ? m.fullName : 'this member';

      showConfirmModal({
        title: 'Permanently Delete Member',
        message: 'Permanently delete ' + name + '? This cannot be undone. Their Member ID, Username, and Email become free to reuse immediately. Their existing contribution and loan records stay in the sheets, but will no longer show their name — only their Member ID. Use Deactivate instead if you want to keep their full name/history intact.',
        confirmLabel: 'Delete Permanently',
        danger: true,
        onConfirm: function () {
          google.script.run
            .withSuccessHandler(function (res) {
              if (res.success) {
                if (EDITING_MEMBER_ID === memberId) cancelEditMember();
                loadMemberList();
              } else {
                showInfoModal(res.message || 'Could not delete member.', 'Error');
              }
            })
            .withFailureHandler(function () {
              showInfoModal('Something went wrong. Please try again.', 'Error');
            })
            .deleteMemberPermanently(TOKEN, memberId);
        }
      });
    }

    function submitMemberForm(e) {
      e.preventDefault();
      const fullName = document.getElementById('memberName').value;
      const memberId = document.getElementById('memberIdInput').value;
      const username = document.getElementById('memberUsername').value;
      const email = document.getElementById('memberEmail').value;
      const password = document.getElementById('memberPassword').value;
      const btn = document.getElementById('memberSubmitBtn');
      const msgEl = document.getElementById('memberFormMsg');
      const isEdit = !!EDITING_MEMBER_ID;
      msgEl.textContent = '';
      msgEl.style.color = '#FF3B30';
      btn.disabled = true;
      btn.textContent = isEdit ? 'Saving...' : 'Adding...';

      const onSuccess = function (res) {
        btn.disabled = false;
        btn.textContent = isEdit ? 'Save Changes' : 'Add Member';
        if (res.success) {
          msgEl.style.color = '#34C759';
          msgEl.textContent = isEdit ? 'Member updated.' : 'Member added.';
          if (isEdit) { cancelEditMember(); } else { document.getElementById('memberForm').reset(); }
          loadMemberList();
        } else {
          msgEl.textContent = res.message || (isEdit ? 'Could not update member.' : 'Could not add member.');
        }
      };
      const onFailure = function () {
        btn.disabled = false;
        btn.textContent = isEdit ? 'Save Changes' : 'Add Member';
        msgEl.textContent = 'Something went wrong. Please try again.';
      };

      if (isEdit) {
        google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure)
          .updateMember(TOKEN, memberId, fullName, username, email, password);
      } else {
        google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure)
          .createMember(TOKEN, fullName, memberId, username, email, password);
      }
    }

    function toggleRepayForm(loanId) {
      const el = document.getElementById('repayForm-' + loanId);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function toggleRepayHistory(loanId) {
      const el = document.getElementById('repayHistory-' + loanId);
      if (el.style.display === 'block') { el.style.display = 'none'; return; }
      el.style.display = 'block';
      el.innerHTML = spinnerHTML();

      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.success) { el.innerHTML = '<div class="err">' + res.message + '</div>'; return; }
          if (!res.history.length) { el.innerHTML = '<div class="empty">No payments recorded yet.</div>'; return; }
          el.innerHTML = res.history.map(function (h) {
            return '<div class="loan-row"><span>' + fmtDate(h.paymentDate) + ' &middot; ' + fmtMoney(h.amountPaid) + '</span>' +
              '<span class="hint" style="margin:0">P ' + fmtMoney(h.principalPaid) + ' / I ' + fmtMoney(h.interestPaid) + '</span></div>';
          }).join('');
        })
        .withFailureHandler(function () {
          el.innerHTML = '<div class="err">Could not load payment history.</div>';
        })
        .getLoanRepaymentHistory(TOKEN, loanId);
    }

    function submitRepayment(loanId) {
      const amount = parseAmountValue('repayAmount-' + loanId);
      const date = document.getElementById('repayDate-' + loanId).value;
      const btn = document.getElementById('repaySubmit-' + loanId);
      const errEl = document.getElementById('repayErr-' + loanId);
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Saving...';

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            const card = document.getElementById('loanRepay-' + loanId);
            if (res.loanPaidOff) {
              card.innerHTML = '<div class="empty">Loan fully paid off! Refreshing...</div>';
            } else {
              card.innerHTML = '<div class="empty">Payment recorded. Remaining balance: ' + fmtMoney(res.remainingBalance) + '. Refreshing...</div>';
            }
            setTimeout(renderLoanRepayments, 900);
          } else {
            btn.disabled = false;
            btn.textContent = 'Save Payment';
            errEl.textContent = res.message || 'Could not record payment.';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Save Payment';
          errEl.textContent = 'Something went wrong. Please try again.';
        })
        .recordRepayment(TOKEN, loanId, amount, date);
    }

    function addBulkRow() {
      const idx = BULK_ROWS++;
      const options = ACTIVE_MEMBERS.map(function (m) {

      }).join('');
      const row = document.createElement('div');

      row.innerHTML =
        '<select id="bulkMember-' + idx + '">' + options + '</select>' +

        '<input type="text" id="bulkRef-' + idx + '" placeholder="Ref (optional)">' +

    function submitBulkLog() {
      const rows = document.querySelectorAll('.bulk-row');
      const errEl = document.getElementById('bulkError');
      const successEl = document.getElementById('bulkSuccess');
      errEl.textContent = '';
      successEl.textContent = '';
      if (!rows.length) { errEl.textContent = 'Add at least one row.'; return; }

      const entries = [];
      let valid = true;
      rows.forEach(function (row) {
        const idx = row.id.split('-')[1];
        const memberId = document.getElementById('bulkMember-' + idx).value;
        const amount = parseAmountValue('bulkAmount-' + idx);
        const date = document.getElementById('bulkDate-' + idx).value;
        const ref = document.getElementById('bulkRef-' + idx).value;
        if (!memberId || !amount || !date) valid = false;
        entries.push({ memberId: memberId, amount: amount, paymentDate: date, reference: ref });
      });
      if (!valid) { errEl.textContent = 'Every row needs a member, amount, and date.'; return; }

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            successEl.textContent = 'Logged ' + res.count + ' contribution(s).';
            loadBulkLogForm();
          } else {
            errEl.textContent = res.message || 'Could not save entries.';
          }
        })
        .withFailureHandler(function () {
          errEl.textContent = 'Something went wrong. Please try again.';
        })
        .bulkLogContributions(TOKEN, entries);
    }

    function renderSettingsForm(settings) {
      const groups = {};
      SETTINGS_FIELDS.forEach(function (f) {
        if (!groups[f.group]) groups[f.group] = [];
        groups[f.group].push(f);
      });

      let html = '<form id="settingsForm">';
      Object.keys(groups).forEach(function (groupName) {
        html += '<div class="section"><h2>' + groupName + '</h2>';
        groups[groupName].forEach(function (f) {
          const current = settings[f.key] ? settings[f.key].value : '';
          const desc = settings[f.key] ? settings[f.key].description : '';
          html += '<label>' + f.label + '</label>';
          if (f.type === 'select') {
            html += '<select id="setting-' + f.key + '">' +
              f.options.map(function (o) {
                return '<option value="' + o + '"' + (o === current ? ' selected' : '') + '>' + o + '</option>';
              }).join('') + '</select>';
          } else {
            html += '<input type="number" id="setting-' + f.key + '" step="' + f.step + '" value="' + current + '">';
          }
          if (desc) html += '<div class="hint">' + desc + '</div>';
        });
        html += '</div>';
      });
      html += '<button type="submit" id="settingsSaveBtn">Save Settings</button>' +
        '<div id="settingsSaved" class="err"></div></form>';

      document.getElementById('settingsContent').innerHTML = html;
      document.getElementById('settingsForm').addEventListener('submit', saveSettings);
    }

    function saveSettings(e) {
      e.preventDefault();
      const updates = {};
      SETTINGS_FIELDS.forEach(function (f) {
        const el = document.getElementById('setting-' + f.key);
        updates[f.key] = f.type === 'select' ? el.value : Number(el.value);
      });

      const btn = document.getElementById('settingsSaveBtn');
      const msgEl = document.getElementById('settingsSaved');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      msgEl.textContent = '';
      msgEl.style.color = '#A63446';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = 'Save Settings';
          if (res.success) {
            msgEl.style.color = '#3F6B4F';
            msgEl.textContent = 'Saved.';
          } else {
            msgEl.textContent = res.message || 'Could not save settings.';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Save Settings';
          msgEl.textContent = 'Something went wrong. Please try again.';
        })
        .updateSettings(TOKEN, updates);
    }

            return '<div class="loan-row"><span>' + r.memberName +
              '<div class="hint" style="margin:0">avg balance ' + fmtMoney(r.avgBalance) + ' &middot; ' + r.sharePercent.toFixed(2) + '%</div></span>' +
              '<span style="font-weight:700">' + fmtMoney(r.dividendAmount) + '</span></div>';
          }).join('');
      }

      let excludedHtml = '';
      if (res.excluded.length) {
        excludedHtml = '<div class="section"><h2>Not Eligible</h2>' +
          res.excluded.map(function (x) {
            return '<div class="loan-row"><span>' + x.memberName + '</span><span class="hint" style="margin:0">' + x.reason + '</span></div>';
          }).join('') + '</div>';
      }

      document.getElementById('divResults').innerHTML =
        '<div class="calc-box" style="margin-bottom:16px">' +
        '<div class="row"><span>Dividend Pool</span><span>' + fmtMoney(res.poolAmount) + '</span></div>' +
        '<div class="row"><span>Total Share Capital (all eligible members)</span><span>' + fmtMoney(res.totalShareSum) + '</span></div>' +
        '<div class="row total"><span>Eligible Members</span><span>' + res.results.length + '</span></div>' +
        '</div>' +
        '<div class="section">' + rowsHtml + '</div>' +
        excludedHtml +
        '<button id="commitBtn" onclick="checkAndCommitDividends()">Save to Dividends Sheet</button>' +
        '<div id="commitError" class="err"></div>';
    }

    function checkAndCommitDividends() {
      const year = LAST_DIVIDEND_CALC.year;
      google.script.run
        .withSuccessHandler(function (statusRes) {
          if (!statusRes.success) { document.getElementById('commitError').textContent = statusRes.message; return; }
          let msg = 'Save these dividend amounts to the Dividends sheet for ' + year + '?';
          if (statusRes.exists) {
            msg = 'There are already ' + statusRes.count + ' dividend record(s) for ' + year +
              '. Saving will REPLACE them with this calculation. Continue?';
          }
          showConfirmModal({
            title: 'Save Dividends',
            message: msg,
            confirmLabel: 'Save',
            danger: statusRes.exists,
            onConfirm: commitDividends
          });
        })
        .withFailureHandler(function () {
          document.getElementById('commitError').textContent = 'Could not check existing records.';
        })
        .getDividendYearStatus(TOKEN, year);
    }

    function commitDividends() {
      const btn = document.getElementById('commitBtn');
      const errEl = document.getElementById('commitError');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      errEl.textContent = '';

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            btn.textContent = 'Saved';
            errEl.style.color = '#3F6B4F';
            errEl.textContent = 'Saved dividends for ' + res.count + ' member(s).';
          } else {
            btn.disabled = false;
            btn.textContent = 'Save to Dividends Sheet';
            errEl.textContent = res.message || 'Could not save.';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Save to Dividends Sheet';
          errEl.textContent = 'Something went wrong. Please try again.';
        })
        .commitDividendCalculation(TOKEN, LAST_DIVIDEND_CALC.year, LAST_DIVIDEND_CALC.earnings);
    }
  </script>
</body>
</html>
